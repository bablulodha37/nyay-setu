spring.profiles.active=dev
# =========================
# Server Configuration
# =========================
server.port=8080
spring.application.name=nyaysetu-backend

# =========================
# MySQL Database Configuration
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/miner?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Bablu@678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA Configuration
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate automatically detects MySQL dialect
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# Flyway
# =========================
spring.flyway.enabled=false

# =========================
# JWT Configuration
# =========================
jwt.secret=nyaysetu-2024-secure-jwt-signing-key-minimum-256-bits-required
jwt.expiration=86400000

# =========================
# CORS Configuration
# =========================
cors.allowed.origins=http://localhost:5173,http://localhost:4174,http://localhost:3000

# =========================
# File Upload Configuration
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

file.upload-dir=backend/uploads
app.upload.fir-path=backend/uploads/fir
app.upload.evidence-path=backend/uploads/evidence

# =========================
# SMTP Configuration
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# Frontend Configuration
# =========================
app.frontend.url=http://localhost:5173
app.password-reset.token-validity=1800000

# =========================
# Gemini AI
# =========================
gemini.model=gemini-1.5-flash
gemini.api.key=

# =========================
# OpenAI
# =========================
openai.api.key=

# =========================
# Ollama
# =========================
ollama.base.url=http://localhost:11434
ollama.model=gemma3:1b
ai.provider=ollama

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================
# Logging
# =========================
logging.level.com.nyaysetu=INFO

# =========================
# Groq AI
# =========================
groq.api.key=
groq.model=llama-3.1-8b-instant

# =========================
# Chat Session
# =========================
chat.session.timeout.minutes=30
chat.max.messages.per.session=100